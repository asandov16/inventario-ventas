name: keepalive

# Deploys the keep-alive Worker (F8-T07, ADR-042) and pings both Supabase projects once.
# Runs on merges to main that touch the Worker, and by hand (Actions → keepalive → Run workflow).
# Staging values come from the staging environment; production's public URL and anon key
# come from repository variables PROD_SUPABASE_URL / PROD_SUPABASE_ANON_KEY (public by design).

on:
  push:
    branches: [main]
    paths:
      - 'workers/keepalive/**'
      - '.github/workflows/keepalive.yml'
  workflow_dispatch:

# Public repository: least privilege by default. Never use pull_request_target.
permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.158.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: keepalive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check that production values are configured
        env:
          PROD_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$PROD_SUPABASE_URL" ] || [ -z "$PROD_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the repository variables PROD_SUPABASE_URL and PROD_SUPABASE_ANON_KEY (docs/runbooks/proyecto-pausado.md)"
            exit 1
          fi
      - name: Deploy the Worker
        working-directory: workers/keepalive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PROD_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY }}
        run: |
          echo "::add-mask::${PROD_SUPABASE_ANON_KEY}"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy \
            --var "STAGING_SUPABASE_URL:${STAGING_SUPABASE_URL}" \
            --var "STAGING_SUPABASE_ANON_KEY:${STAGING_SUPABASE_ANON_KEY}" \
            --var "PROD_SUPABASE_URL:${PROD_SUPABASE_URL}" \
            --var "PROD_SUPABASE_ANON_KEY:${PROD_SUPABASE_ANON_KEY}"
      # The cron's first run can be up to 6 hours away: touch both projects now.
      - name: Ping both projects once
        env:
          STAGING_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PROD_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY }}
        run: node --experimental-strip-types workers/keepalive/run-once.ts
