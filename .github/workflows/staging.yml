name: staging

# Staging only (ADR-038): fictional data, test users with secret passwords.
# - Pull requests from this repository get a preview of the app at https://pr-<n>.inv-web.pages.dev
# - Every merge to main applies new migrations to inv-staging and publishes https://staging.inv-web.pages.dev
# Production deploys arrive in Stage 4 with their own reviewed environment.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]

# Public repository: least privilege by default. Never use pull_request_target.
permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.158.0
  PAGES_PROJECT: inv-web
  # Shown in the header so nobody confuses staging with the real app.
  VITE_APP_NAME: Inventario y Ventas · Pruebas

jobs:
  preview:
    # Secrets are only available to pull requests opened from this repository (never forks or Dependabot).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build against staging
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build
      - name: Publish the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: pr-${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/scripts/deploy-pages.sh" "$GITHUB_WORKSPACE/web/dist" "$BRANCH" "$COMMIT"
      - name: Comment the preview link on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- staging-preview -->'
          body="${marker}
          **Vista previa (staging):** https://pr-${PR}.inv-web.pages.dev

          Datos ficticios de staging; entra con un usuario de prueba de staging. Commit \`${COMMIT::7}\`."
          comment_id=$(gh api "repos/${GH_REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Forward-only migrations; the seed never runs here (ADR-033).
      - name: Apply new migrations to inv-staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Build against staging
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build
      - name: Publish https://staging.inv-web.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash "$GITHUB_WORKSPACE/scripts/deploy-pages.sh" "$GITHUB_WORKSPACE/web/dist" staging "$GITHUB_SHA"
